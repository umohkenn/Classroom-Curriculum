{% raw %}{% endraw %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Curriculum → Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#f2f5fb; --bg1:#ffffff; --panel:#ffffff; --panel2:#f4f7fd;
  --line:#e2e8f4; --line2:#c7d2e6;
  --tx:#111c38; --tx2:#5a6a88; --tx3:#8b98b0;
  --c1:#22d3ee; --c2:#8b5cf6; --c3:#f472b6;
  --grad:linear-gradient(120deg,var(--c1),var(--c2) 60%,var(--c3));
  --green:#059669; --amber:#b45309; --red:#dc2626; --blue:#2563eb;
  --r:16px; --rs:10px;
  --glow:0 0 0 1px rgba(34,211,238,.45),0 8px 24px rgba(139,92,246,.10);
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{background:var(--bg0);color:var(--tx);font:14.5px/1.5 Inter,system-ui,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:
  radial-gradient(60vw 40vh at 15% -5%,rgba(139,92,246,.10),transparent 60%),
  radial-gradient(50vw 40vh at 95% 10%,rgba(34,211,238,.10),transparent 60%),
  radial-gradient(40vw 50vh at 60% 110%,rgba(244,114,182,.08),transparent 60%),var(--bg0)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;background-image:
  linear-gradient(rgba(28,43,74,.045) 1px,transparent 1px),
  linear-gradient(90deg,rgba(28,43,74,.045) 1px,transparent 1px);background-size:44px 44px}
h1,h2,h3,h4,.display{font-family:'Space Grotesk',Inter,sans-serif}
a{color:var(--c1)}
::selection{background:rgba(139,92,246,.22)}
.shell{display:flex;min-height:100vh}
/* ---------- rail ---------- */
.rail{width:236px;flex-shrink:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  padding:20px 14px;border-right:1px solid var(--line);background:rgba(255,255,255,.82);backdrop-filter:blur(14px);box-shadow:4px 0 24px rgba(28,43,74,.05)}
.brand{display:flex;gap:11px;align-items:center;padding:2px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand .dot{width:40px;height:40px;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 24px rgba(139,92,246,.45);overflow:hidden;flex-shrink:0}
.brand .dot img{width:100%;height:100%;object-fit:cover}
.brand .t1{font-family:'Space Grotesk';font-weight:700;font-size:15px;line-height:1.15}
.brand .t2{font-size:11px;color:var(--tx2)}
.nav{display:flex;flex-direction:column;gap:4px}
.nbtn{display:flex;align-items:center;gap:11px;border:1px solid transparent;background:transparent;color:var(--tx2);
  font:600 13.5px Inter;padding:10px 12px;border-radius:12px;cursor:pointer;text-align:left;width:100%;
  transition:all .18s ease;position:relative;overflow:hidden}
.nbtn:hover{color:var(--tx);background:var(--panel);border-color:var(--line)}
.nbtn.on{color:#ffffff;background:var(--grad);box-shadow:0 6px 22px rgba(139,92,246,.35);font-weight:700}
.nbtn .bdg{margin-left:auto;font-size:10.5px;font-weight:700;background:rgba(255,255,255,.14);border-radius:999px;padding:2px 8px}
.nbtn.on .bdg{background:rgba(0,0,0,.22);color:#fff}
.rolechip{margin-top:auto;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);font-size:12px;color:var(--tx2)}
.rolechip b{color:var(--tx);display:block;font-size:12.5px}
.rolechip .pill{display:inline-block;margin-top:6px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.main{flex:1;min-width:0;padding:28px 32px 80px}
.head h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em}
.head p{margin:5px 0 0;color:var(--tx2);font-size:13.5px}
.head{margin-bottom:22px;display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
@media(max-width:860px){.shell{flex-direction:column}
  .rail{width:100%;height:auto;position:static;flex-direction:column;padding:12px}
  .nav{flex-direction:row;overflow-x:auto;padding-bottom:8px}.nbtn{flex-shrink:0}
  .rolechip{display:none}.main{padding:18px 14px 80px}}
/* ---------- primitives ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;
  backdrop-filter:blur(10px);transition:border-color .2s}
.panel:hover{border-color:var(--line2)}
.panel h2{margin:0 0 14px;font-size:16px;display:flex;gap:9px;align-items:center}
.grid2{display:grid;grid-template-columns:400px 1fr;gap:22px;align-items:start}
@media(max-width:1060px){.grid2{grid-template-columns:1fr}}
.field{margin-bottom:13px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:#ffffff;border:1px solid var(--line2);
  border-radius:var(--rs);padding:10px 12px;color:var(--tx);font:inherit;transition:all .18s}
.field input:hover,.field select:hover,.field textarea:hover{border-color:rgba(148,163,184,.5)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--c1);box-shadow:0 0 0 3px rgba(34,211,238,.18)}
.field textarea{min-height:100px;resize:vertical}
.field select option{background:var(--bg1)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--tx);
  border-radius:var(--rs);padding:8px 15px;font:600 12.5px Inter;cursor:pointer;transition:all .18s;text-decoration:none;position:relative}
.btn:hover{border-color:var(--c1);color:var(--c1);transform:translateY(-1px);box-shadow:0 6px 18px rgba(34,211,238,.15)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--grad);border:none;color:#ffffff;font-weight:700;box-shadow:0 6px 20px rgba(139,92,246,.35)}
.btn.primary:hover{color:#ffffff;filter:brightness(1.12);box-shadow:0 10px 28px rgba(139,92,246,.5)}
.btn.danger{color:var(--red)}.btn.danger:hover{border-color:var(--red);box-shadow:0 6px 18px rgba(220,38,38,.10)}
.btn:disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn.go{width:100%;justify-content:center;padding:13px;font-size:14px;border-radius:12px}
:is(.btn,.nbtn,.tab):focus-visible{outline:2px solid var(--c3);outline-offset:2px}
.hint{font-size:12.5px;color:var(--tx2);margin-top:9px;line-height:1.55}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  border-radius:999px;padding:3px 10px;border:1px solid transparent}
.chip.green{background:rgba(5,150,105,.12);color:var(--green)} .chip.amber{background:rgba(180,83,9,.12);color:var(--amber)}
.chip.red{background:rgba(220,38,38,.10);color:var(--red)} .chip.blue{background:rgba(37,99,235,.12);color:var(--blue)}
.chip.grad{background:var(--grad);color:#ffffff}
.pickrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.pick{border:1px solid var(--line2);background:transparent;color:var(--tx2);border-radius:999px;padding:7px 15px;
  font:600 12.5px Inter;cursor:pointer;transition:all .18s}
.pick:hover{border-color:var(--c1);color:var(--c1)}
.pick.on{background:var(--grad);border-color:transparent;color:#ffffff;font-weight:700;box-shadow:0 4px 14px rgba(139,92,246,.35)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--tx2);border-radius:10px;padding:8px 15px;
  font:600 13px Inter;cursor:pointer;display:flex;gap:8px;align-items:center;transition:all .18s}
.tab:hover{color:var(--tx);border-color:var(--line2)}
.tab.on{color:var(--tx);border-color:transparent;background:linear-gradient(var(--bg1),var(--bg1)) padding-box,var(--grad) border-box;
  border:1.5px solid transparent;box-shadow:var(--glow)}
.dot{width:8px;height:8px;border-radius:50%}.dot.q{background:var(--tx3)}.dot.l{background:var(--amber);animation:pulse 1s infinite}
.dot.d{background:var(--green)}.dot.e{background:var(--red)}
@keyframes pulse{50%{opacity:.25}}
.empty{border:1.5px dashed var(--line2);border-radius:var(--r);padding:54px 26px;text-align:center;color:var(--tx2)}
.empty .big{font-family:'Space Grotesk';font-size:19px;color:var(--tx);margin:10px 0 6px}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden;transition:all .2s}
.stat:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:0 10px 26px rgba(28,43,74,.12)}
.stat::before{content:"";position:absolute;inset:0 0 auto 0;height:2.5px;background:var(--grad);opacity:.85}
.stat .n{font-family:'Space Grotesk';font-weight:700;font-size:25px;line-height:1.1}
.stat .l{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);margin-top:4px}
.stat .s{font-size:11.5px;color:var(--tx2);margin-top:4px}
.stat.red .n{color:var(--red)}.stat.amber .n{color:var(--amber)}.stat.blue .n{color:var(--blue)}.stat.green .n{color:var(--green)}
.chartcard h3{margin:0 0 10px;font-size:14px;color:var(--tx2);font-weight:600}
.chartgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.skel{height:13px;border-radius:6px;margin-top:14px;background:linear-gradient(90deg,rgba(28,43,74,.07) 25%,rgba(28,43,74,.14) 45%,rgba(28,43,74,.07) 65%);
  background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.skel,.dot.l{animation:none}}
/* paper: rendered documents keep the exercise-book soul, re-lit for dark */
.page{background:#fbf9f2;color:#1c2b4a;border-radius:12px;padding:26px 28px 34px 62px;position:relative;min-height:300px;
  background-image:repeating-linear-gradient(to bottom,transparent 0 27px,#dfe6f0 27px 28px);line-height:28px;
  box-shadow:0 14px 44px rgba(28,43,74,.16)}
.page::before{content:"";position:absolute;top:0;bottom:0;left:44px;width:1.5px;background:#c0392b;opacity:.7}
.lh{display:flex;gap:13px;align-items:center;border-bottom:3px double #24513f;padding-bottom:11px;margin-bottom:14px;background:#fbf9f2}
.lh img{width:50px;height:50px;object-fit:contain}
.lh .n{font-family:'Space Grotesk';font-weight:700;font-size:19px}
.lh .s{font-size:12px;color:#5a6a88}
.lh .d{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.md h2{font-size:18px;margin:28px 0 0;font-family:'Space Grotesk'}
.md h3{font-size:15.5px;margin:28px 0 0;font-family:'Space Grotesk'}
.md p{margin:0}.md ul,.md ol{margin:0;padding-left:22px}.md li{margin:0}
.md table{border-collapse:collapse;width:100%;font-size:13px;margin:14px 0;background:#fff;line-height:1.5}
.md th,.md td{border:1px solid #dde3ec;padding:7px 10px;text-align:left;vertical-align:top}
.md th{background:#eef2f8;font-weight:700}
.md .svgbox{margin:14px 0;background:#fff;border:1px solid #dde3ec;border-radius:8px;padding:12px;line-height:0}
.md .svgbox svg{max-width:100%;height:auto}
.md pre{background:#f1f4f9;border:1px solid #dde3ec;border-radius:6px;padding:10px;font-size:12.5px;overflow-x:auto;line-height:1.5}
/* cards & lists */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:11px;cursor:pointer;transition:all .18s}
.card:hover{border-color:var(--c2);transform:translateY(-2px);box-shadow:0 12px 28px rgba(139,92,246,.16)}
.card h3{margin:0 0 4px;font-size:15.5px}
.card .m{font-size:12.5px;color:var(--tx2)}
.card .right{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.card.flex{display:flex;justify-content:space-between;align-items:center;gap:12px}
.termhead{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,rgba(34,211,238,.10),rgba(139,92,246,.10));
  border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;cursor:pointer;margin:18px 0 10px;transition:all .18s}
.termhead:hover{border-color:var(--line2)} .termhead:first-of-type{margin-top:0}
.termhead .t{font-family:'Space Grotesk';font-weight:700;font-size:15.5px}
.termhead .bdg{margin-left:auto;font-size:11px;font-weight:700;background:var(--panel2);border-radius:999px;padding:3px 10px;color:var(--tx2)}
.termhead .chev{transition:transform .2s;display:inline-flex}.termhead.closed .chev{transform:rotate(-90deg)}
.weekblk{margin:0 0 12px 8px;border-left:2px solid var(--line2);padding-left:16px}
.weektitle{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);margin:10px 0 8px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.mat{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--rs);padding:9px 12px;margin-bottom:7px;background:var(--panel)}
.mat .nm{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
/* timetable */
.ttwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.tt{border-collapse:separate;border-spacing:6px;width:100%;min-width:760px}
.tt th{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);padding:4px}
.tt .time{font-size:11px;color:var(--tx3);white-space:nowrap;text-align:right;padding-right:6px}
.tt .time input{width:56px;background:transparent;border:1px solid transparent;border-radius:6px;color:var(--tx2);font:11px Inter;text-align:center;padding:2px}
.tt .time input:hover{border-color:var(--line2)} .tt .time input:focus{outline:none;border-color:var(--c1);background:#ffffff}
.slot{border:1.5px dashed var(--line);border-radius:11px;min-width:112px;height:60px;cursor:pointer;vertical-align:top;padding:0;transition:all .15s;background:#fbfcff}
.slot:hover{border-color:var(--c1);box-shadow:0 0 14px rgba(34,211,238,.28)}
.slot.filled{border-style:solid;border-color:transparent}
.slot.sel{outline:2px solid var(--c3);outline-offset:1px}
.slot .in{width:100%;height:100%;border-radius:10px;padding:7px 9px;text-align:left;font-size:11.5px;line-height:1.3;overflow:hidden}
.slot .in .s{font-weight:700;font-size:12px}
.slot .in .t{opacity:.85;display:flex;gap:5px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
/* calendar */
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.caldow{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);text-align:center;padding:6px 0}
.calcell{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:88px;padding:6px 8px;font-size:12px;transition:all .15s}
.calcell:hover{border-color:var(--line2)} .calcell.blank{background:transparent;border-color:transparent}
.calcell.today{border-color:var(--c1);box-shadow:var(--glow)}
.caldn{font-weight:700;color:var(--tx3);font-size:11px;margin-bottom:4px}
.caltopic{border-radius:7px;padding:4px 8px;margin-bottom:4px;font-weight:600;cursor:pointer;font-size:11px;line-height:1.35;transition:all .12s}
.caltopic:hover{transform:translateY(-1px)}
.caltopic.p{background:rgba(180,83,9,.12);color:var(--amber)} .caltopic.c{background:rgba(5,150,105,.12);color:var(--green);text-decoration:line-through}
.caltopic.o{background:rgba(220,38,38,.10);color:var(--red)}
.toaststack{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:99;align-items:center;pointer-events:none}
.toast{background:#111c38;border:1px solid #111c38;color:#fff;border-radius:999px;padding:10px 20px;font:600 13px Inter;
  box-shadow:0 10px 30px rgba(28,43,74,.3);animation:tin .25s ease;backdrop-filter:blur(8px)}
.toast.err{background:var(--red);border-color:var(--red);color:#fff}
.toast.ok{border-color:rgba(52,211,153,.5)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
svg.icn{width:17px;height:17px;flex-shrink:0}
.bucket{display:flex;align-items:center;gap:9px;margin:20px 0 9px;font-family:'Space Grotesk';font-weight:700;font-size:15px}
.crumb{display:flex;gap:8px;align-items:center;color:var(--tx2);font-size:12.5px;margin-bottom:14px;flex-wrap:wrap}
.crumb a{color:var(--tx2);text-decoration:none}.crumb a:hover{color:var(--c1)}
.crumb .sep{color:var(--tx3)}
</style>

<style id="uix2">
/* ============ UI/UX polish layer ============ */
/* headings: eyebrow + gradient underline */
.eyebrow{font:700 10.5px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--c2);margin-bottom:6px}
.head h1{letter-spacing:-.015em}
.head h1::after{content:"";display:block;width:46px;height:4px;border-radius:99px;background:var(--grad);margin-top:9px}
/* view entrance (staggered) */
#mainview>*{animation:rise .4s cubic-bezier(.22,.9,.3,1) both}
#mainview>*:nth-child(2){animation-delay:.05s}#mainview>*:nth-child(3){animation-delay:.1s}
#mainview>*:nth-child(4){animation-delay:.15s}#mainview>*:nth-child(5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* sidebar refinements */
.rail{border-right:1px solid #e8edf7}
.nbtn{transition:all .2s cubic-bezier(.22,.9,.3,1)}
.nbtn:hover{transform:translateX(3px)}
.nbtn svg{opacity:.8}.nbtn.on svg{opacity:1}
.brand .dot{box-shadow:0 6px 20px rgba(139,92,246,.35)}
.rolechip{display:flex;gap:10px;align-items:center}
.rolechip::before{content:attr(data-init);width:34px;height:34px;border-radius:10px;background:var(--grad);
  color:#fff;font:700 12px 'Space Grotesk';display:flex;align-items:center;justify-content:center;flex-shrink:0}
/* buttons: sheen sweep on primary */
.btn.primary{overflow:hidden}
.btn.primary::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);transition:left .45s ease}
.btn.primary:hover::after{left:125%}
.btn{will-change:transform}
/* stat cards: icon bubble + depth */
.stat{padding-right:56px}
.stat .ico{position:absolute;top:13px;right:13px;width:34px;height:34px;border-radius:11px;
  background:linear-gradient(135deg,rgba(34,211,238,.14),rgba(139,92,246,.16));color:var(--c2);
  display:flex;align-items:center;justify-content:center}
.stat.red .ico{background:rgba(220,38,38,.10);color:var(--red)}
.stat.amber .ico{background:rgba(180,83,9,.10);color:var(--amber)}
.stat.blue .ico{background:rgba(37,99,235,.10);color:var(--blue)}
.stat.green .ico{background:rgba(5,150,105,.10);color:var(--green)}
/* chart cards */
.chartcard{position:relative;overflow:hidden}
.chartcard::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--grad);opacity:.7}
.chartcard h3{padding-left:6px}
.chartcard:hover{box-shadow:0 14px 36px rgba(28,43,74,.10)}
/* cards */
.card{position:relative}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;border-radius:3px;background:var(--grad);opacity:0;transition:opacity .18s}
.card:hover::before{opacity:.9}
/* tabs -> segmented pills */
.tabs{background:#eaeff8;border:1px solid var(--line);border-radius:13px;padding:5px;gap:4px;width:fit-content;max-width:100%}
.tab{border:none;background:transparent;border-radius:9px;padding:8px 15px}
.tab.on{background:#fff;border:none;box-shadow:0 2px 10px rgba(28,43,74,.10),inset 0 0 0 1.5px rgba(139,92,246,.35)}
/* empty states */
.empty{background:#fff}
.empty svg{color:var(--c2);opacity:.7}
/* paper page: gradient binding strip */
.page{overflow:hidden}
.page::after{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--grad);opacity:.55}
/* timetable: hover row + today column */
.tt tbody tr:hover .slot:not(.filled){border-color:#b9c7e0;background:#f6f9ff}
.tt thead th.isToday{color:#fff;background:var(--grad);border-radius:8px;box-shadow:0 4px 12px rgba(139,92,246,.3)}

async function api(method,args={}){
  const r=await fetch(`/api/method/curriculum_classroom.api.api.${method}`,{
    method:"POST",headers:{"Content-Type":"application/json","X-Frappe-CSRF-Token":window.CSRF},
    body:JSON.stringify(args)});

  if(!r.ok||d.exc_type){const m=(d._server_messages&&JSON.parse(JSON.parse(d._server_messages)[0]).message)||d.exception||d.message||"Request failed";throw new Error(String(m).replace(/<[^>]+>/g,""));}
  return d.message;
}

const icn=(p,s=17)=>`<svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:${s}px;height:${s}px">${p}</svg>`;
/* tiny markdown (tables, svg fences, headings, lists, bold) */
function md(text){const L=(text||"").replace(/\r/g,"").split("\n");let o="",i=0,list=null;
 const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
 const flush=()=>{if(list){o+=list.o?`<ol>${list.h}</ol>`:`<ul>${list.h}</ul>`;list=null;}};
 while(i<L.length){const t=L[i].trim();const f=t.match(/^```(\w*)/);
  if(f){flush();const lang=f[1].toLowerCase();let buf=[];i++;
   while(i<L.length&&!L[i].trim().startsWith("```")){buf.push(L[i]);i++;}i++;
   const code=buf.join("\n");
   if(lang==="svg"||code.trim().startsWith("<svg"))o+=`<div class="svgbox">${code}</div>`;
   else o+=`<pre>${esc(code)}</pre>`;continue;}
  if(t.startsWith("|")&&L[i+1]&&/^[\s|:\-]+$/.test(L[i+1].trim())){flush();const rows=[];
   while(i<L.length&&L[i].trim().startsWith("|")){rows.push(L[i].trim());i++;}
   const parse=r=>r.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
   const h=parse(rows[0]),body=rows.slice(2).map(parse);
   o+=`<table><thead><tr>${h.map(c=>`<th>${inl(c)}</th>`).join("")}</tr></thead><tbody>${
     body.map(r=>`<tr>${r.map(c=>`<td>${inl(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;continue;}
  if(!t){flush();i++;continue;}
  const h=t.match(/^(#{1,4})\s+(.*)/);
  if(h){flush();o+=h[1].length<=2?`<h2>${inl(h[2])}</h2>`:`<h3>${inl(h[2])}</h3>`;i++;continue;}
  const ol=t.match(/^\d+[.)]\s+(.*)/),ul=t.match(/^[-*\u2022]\s+(.*)/);
  if(ol){if(!list||!list.o){flush();list={o:1,h:""};}list.h+=`<li>${inl(ol[1])}</li>`;i++;continue;}
  if(ul){if(!list||list.o){flush();list={o:0,h:""};}list.h+=`<li>${inl(ul[1])}</li>`;i++;continue;}
  flush();o+=`<p>${inl(t)}</p>`;i++;}
 flush();return o;}
/* SVG charts */
function chartSVG(c){const W=340,H=190,P=30;const vals=c.values||[],labels=c.labels||[];
 if(!vals.length)return `<div class="empty" style="padding:26px">No data yet</div>`;
 if(c.type==="donut"){const tot=vals.reduce((a,b)=>a+b,0)||1;let a0=-Math.PI/2,segs="";
  const cols=["url(#g1)","rgba(148,163,184,.25)","#f472b6","#60a5fa","#fbbf24"];
  vals.forEach((v,i)=>{const a1=a0+v/tot*2*Math.PI;const large=a1-a0>Math.PI?1:0;
   const x0=95+ECOS(a0)*62,y0=95+ESIN(a0)*62,x1=95+ECOS(a1)*62,y1=95+ESIN(a1)*62;
   if(v>0)segs+=`<path d="M ${x0} ${y0} A 62 62 0 ${large} 1 ${x1} ${y1}" stroke="${cols[i%cols.length]}" stroke-width="20" fill="none" stroke-linecap="butt"/>`;a0=a1;});
  const pct=Math.round((vals[0]/tot)*100);
  return `<svg viewBox="0 0 340 190">${GRAD}${segs.replace(/95/g,m=>m)}
   <text x="95" y="100" text-anchor="middle" fill="#111c38" font-size="26" font-weight="700" font-family="Space Grotesk">${pct}%</text>
   ${labels.map((l,i)=>`<g transform="translate(190,${60+i*26})"><rect width="12" height="12" rx="3" fill="${cols[i%cols.length]}"/><text x="20" y="11" fill="#93a3bc" font-size="12">${esc(l)}: ${vals[i]}</text></g>`).join("")}</svg>`;}
 const max=Math.max(...vals,1);const bw=Math.min(46,(W-P*2)/vals.length-10);
 if(c.type==="line"){const pts=vals.map((v,i)=>[P+i*(W-P*2)/Math.max(vals.length-1,1),H-P-(v/max)*(H-P*2-10)]);
  const path=pts.map((p,i)=>`${i?"L":"M"} ${p[0]} ${p[1]}`).join(" ");
  return `<svg viewBox="0 0 340 190">${GRAD}
   <path d="${path}" stroke="url(#g1)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
   ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#ffffff" stroke="url(#g1)" stroke-width="2"><title>${esc(labels[i]||"")}: ${vals[i]}%</title></circle>`).join("")}
   ${pts.map((p,i)=>`<text x="${p[0]}" y="${p[1]-10}" text-anchor="middle" fill="#93a3bc" font-size="10">${vals[i]}</text>`).join("")}</svg>`;}
 return `<svg viewBox="0 0 340 190">${GRAD}
  ${vals.map((v,i)=>{const x=P+i*(W-P*2)/vals.length+5,h=(v/max)*(H-P*2-8),y=H-P-h;
   return `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,2)}" rx="6" fill="url(#g1)" opacity="0.9"><title>${esc(labels[i]||"")}: ${v}</title></rect>
    <text x="${x+bw/2}" y="${y-6}" text-anchor="middle" fill="#93a3bc" font-size="10">${v}</text>
    <text x="${x+bw/2}" y="${H-P+13}" text-anchor="middle" fill="#5b6b85" font-size="9">${esc(String(labels[i]||"").slice(0,9))}</text>`;}).join("")}</svg>`;}
const GRAD=`<defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".6" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs>`;

function genOut(){const g=S.gen;const keys=Object.keys(g.docs);

 return `<div class="tabs">${keys.map(k=>`<button class="tab ${act===k?"on":""}" onclick="S.gen.active='${k}';$('#genout').innerHTML=genOut()">
   <span class="dot ${d&&g.docs[k].status==="loading"?"l":g.docs[k].status==="done"?"d":g.docs[k].status==="error"?"e":"q"}"></span>${DOCL[k]}</button>`).join("")}</div>

  ${d.status==="queued"?`<p style="color:#5a6a88;font-style:italic">Queued — written next.</p>`:""}

async function generate(){const f=S.form;
 f.topic=$("#f_topic").value.trim();f.term=$("#f_term").value;f.week=$("#f_week").value;
 f.duration=$("#f_dur").value;f.extra=$("#f_extra").value;
 const picks=Object.keys(S.picks).filter(k=>S.picks[k]);
 if(!f.topic){toast("Enter a topic","err");return;}
 if(!picks.length){toast("Pick at least one document","err");return;}
 S.gen={running:true,done:0,total:picks.length,docs:Object.fromEntries(picks.map(k=>[k,{status:"queued"}])),active:picks[0]};
 render();
 for(const k of picks){
  S.gen.docs[k]={status:"loading"};S.gen.active=k;$("#genout").innerHTML=genOut();
  try{const r=await api("generate_documents",{program:S.sel.program,course:S.sel.course,
    topic:f.topic,doc_types:JSON.stringify([k]),term:f.term,week:f.week,
    duration:f.duration,extra:f.extra,curriculum:S.curr&&S.curr.name,topic_row:f.row});
   const res=r.results[k];
   S.gen.docs[k]=res.ok?{status:"done",content:res.content}:{status:"error",error:res.error};
  }catch(e){S.gen.docs[k]={status:"error",error:e.message};}
  S.gen.done++;$("#genout").innerHTML=genOut();
  const gb=$("#genbtn");if(gb)gb.innerHTML=`${icn(I.spark,15)} Preparing ${Math.min(S.gen.done+1,S.gen.total)} of ${S.gen.total}…`;
 }
 S.gen.running=false;S.lib=[];toast("Documents ready and filed in Library");render();}

async function vTimetable(){const m=$("#mainview");

 const el=$("#ttbody");
 if(!S.groups.length){el.innerHTML=`<div class="empty">${icn(I.grid,28)}<div class="big">No Student Groups found</div>Create Student Groups in Desk (Education) — each gets its own timetable here.</div>`;return;}
 if(!S.ttGroup)S.ttGroup=S.groups[0].name;
 if(!S.tt||S.tt.student_group!==S.ttGroup){S.tt=await api("timetable_get",{student_group:S.ttGroup});
  if(!S.tt.slots.length)S.tt.slots=defaultSlots();}
 el.innerHTML=`<div class="pickrow">${S.groups.map(g=>`<button class="pick ${S.ttGroup===g.name?"on":""}" onclick="S.ttGroup='${esc(g.name)}';S.tt=null;S.selSlot=null;render()">${esc(g.student_group_name||g.name)}</button>`).join("")}</div>
 ${ttGrid(true)}
 <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
  <button class="btn" onclick="addPeriodRow()">${icn(I.plus,13)} Add period</button>
  <button class="btn primary" onclick="saveTT()">${icn(I.check,13)} Save timetable</button></div>
 <div id="slotedit">${slotEditor()}</div>`;}
function defaultSlots(){const out=[];let h=8,mi=0;
 for(let p=1;p<=8;p++){const st=`${String(h).padStart(2,"0")}:${String(mi).padStart(2,"0")}`;
  mi+=40;h+=Math.floor(mi/60);mi%=60;const en=`${String(h).padStart(2,"0")}:${String(mi).padStart(2,"0")}`;
  out.push({day:"Monday",period_no:p,start_time:st,end_time:en});}
 return out;}
function periods(){const map={};S.tt.slots.forEach(s=>{if(!map[s.period_no])map[s.period_no]={period_no:s.period_no,start_time:s.start_time,end_time:s.end_time};});
 const ps=Object.values(map).sort((a,b)=>a.period_no-b.period_no);
 return ps.length?ps:Array.from({length:S.tt.periods_per_day||8},(_,i)=>({period_no:i+1,start_time:"",end_time:""}));}
function slotAt(day,p){return S.tt.slots.find(s=>s.day===day&&s.period_no===p&&(s.course||s.subject));}
function ttGrid(edit){const ps=periods();
 return `<div class="ttwrap"><table class="tt"><thead><tr><th style="text-align:right">Time</th>${DAYS.map(d=>`<th>${d.slice(0,3)}</th>`).join("")}${edit?"<th></th>":""}</tr></thead><tbody>
 ${ps.map(p=>`<tr><td class="time">
   ${edit?`<input value="${esc(p.start_time||"")}" onchange="setPeriodTime(${p.period_no},'start_time',this.value)">–<input value="${esc(p.end_time||"")}" onchange="setPeriodTime(${p.period_no},'end_time',this.value)">`
   :`${esc((p.start_time||"").slice(0,5))} – ${esc((p.end_time||"").slice(0,5))}`}</td>
  ${DAYS.map(d=>{const s=slotAt(d,p.period_no);const sel=S.selSlot&&S.selSlot.day===d&&S.selSlot.p===p.period_no;
   const h=s?hue(s.course||s.subject):0;
   return `<td class="slot ${s?"filled":""} ${sel?"sel":""}" ${edit?`onclick="S.selSlot={day:'${d}',p:${p.period_no}};render()"`:""}>
    ${s?`<div class="in" style="background:hsl(${h} 75% 93%);color:hsl(${h} 55% 28%);border:1px solid hsl(${h} 55% 80%)">
     <div class="s">${esc(s.subject||s.course)}</div>
     ${s.topic_title?`<div class="t"><span class="tdot" style="background:var(--amber)"></span>${esc(s.topic_title)}</div>`:""}</div>`:""}</td>`;}).join("")}
  ${edit?`<td><button class="btn danger" style="padding:4px 8px" onclick="event.stopPropagation();rmPeriod(${p.period_no})">✕</button></td>`:""}</tr>`).join("")}
 </tbody></table></div>`;}
function setPeriodTime(p,k,v){S.tt.slots.forEach(s=>{if(s.period_no===p)s[k]=v;});
 if(!S.tt.slots.some(s=>s.period_no===p))S.tt.slots.push({day:"Monday",period_no:p,[k]:v});}
function addPeriodRow(){const ps=periods();const last=ps[ps.length-1]||{period_no:0,end_time:"08:00"};
 S.tt.slots.push({day:"Monday",period_no:last.period_no+1,start_time:last.end_time||"",end_time:""});render();}
function rmPeriod(p){S.tt.slots=S.tt.slots.filter(s=>s.period_no!==p);if(S.selSlot&&S.selSlot.p===p)S.selSlot=null;render();}
function slotEditor(){if(!S.selSlot)return "";const {day,p}=S.selSlot;
 const cur=S.tt.slots.find(s=>s.day===day&&s.period_no===p)||{};
 const courses=(S.programs.find(x=>x.name===cur.programX)||{}).courses||S.programs.flatMap(x=>x.courses);
 const topics=(S.curr&&S.curr.topics)||[];
 return `<section class="panel" style="margin-top:14px"><h2>${icn(I.grid)} ${day} · Period ${p} · ${esc(S.ttGroup)}</h2>
  <div class="row3">
   <div class="field"><label>Course</label><select id="sl_c">${`<option value="">— none —</option>`+[...new Set(courses)].map(c=>`<option ${cur.course===c?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
   <div class="field"><label>Subject label (optional)</label><input id="sl_s" value="${esc(cur.subject||"")}" placeholder="shown on the grid"></div>
   <div class="field"><label>Curriculum topic (optional)</label><input id="sl_t" value="${esc(cur.topic_title||"")}" placeholder="e.g. Photosynthesis"></div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
   <button class="btn primary" onclick="applySlot()">${icn(I.check,13)} Apply to slot</button>
   <button class="btn danger" onclick="clearSlot()">${icn(I.trash,13)} Clear slot</button>
   <button class="btn" onclick="S.selSlot=null;render()">Done</button></div>
  <p class="hint">Link a curriculum topic to map the timetable to the scheme of work; save the timetable to persist.</p></section>`;}
function applySlot(){const {day,p}=S.selSlot;const per=periods().find(x=>x.period_no===p)||{};
 S.tt.slots=S.tt.slots.filter(s=>!(s.day===day&&s.period_no===p));
 S.tt.slots.push({day,period_no:p,start_time:per.start_time,end_time:per.end_time,
  course:$("#sl_c").value||null,subject:$("#sl_s").value||$("#sl_c").value||"",topic_title:$("#sl_t").value||null});
 render();}
function clearSlot(){const {day,p}=S.selSlot;S.tt.slots=S.tt.slots.filter(s=>!(s.day===day&&s.period_no===p));render();}
async function saveTT(){try{
  if(!S.programs.length){try{S.programs=await api("programs");}catch(e){}}
  S.tt=await api("timetable_save",{student_group:S.ttGroup,slots:JSON.stringify(S.tt.slots),
   periods_per_day:periods().length});toast("Timetable saved");render();}catch(e){toast(e.message,"err");}}

 ["pp_p","pp_y","pp_t"].forEach(id=>$("#"+id).onchange=load);load();}

<script>
/* ============ UI/UX augment: extra icons, live details ============ */
(function(){
 I.target='<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>';
 I.alert='<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>';
 I.clock='<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>';
 I.user='<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>';
 window.IC=n=>I[n]||I[({clipboard:"clip"})[n]]||I.spark;
 const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
 const D3=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date().getDay()];
 let raf=0;
 function scan(){raf=0;
  document.querySelectorAll(".tt thead th").forEach(th=>{
   if(th.textContent.trim()===D3)th.classList.add("isToday");});
  const rc=document.querySelector(".rolechip");
  if(rc&&!rc.dataset.init){const b=rc.querySelector("b");
   rc.dataset.init=((b&&b.textContent)||"?").split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();}
  document.querySelectorAll(".stat .n:not([data-c])").forEach(el=>{el.dataset.c=1;
   if(reduce)return;
   const m=String(el.textContent).match(/^(\d+)(.*)$/);if(!m)return;
   const end=+m[1],suf=m[2];if(end<=1)return;let t0=null;
   const step=ts=>{if(!t0)t0=ts;const p=Math.min((ts-t0)/550,1);
    el.textContent=Math.round(end*(1-Math.pow(1-p,3)))+suf;
    if(p<1)requestAnimationFrame(step);else el.textContent=end+suf;};
   requestAnimationFrame(step);});}
 new MutationObserver(()=>{if(!raf)raf=requestAnimationFrame(scan);})
  .observe(document.getElementById("app")||document.body,{childList:true,subtree:true});
 scan();})();
</script>
